services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-ecommerce-postgres-mvp
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_mvp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/ai-ecommerce-assistant
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?NVIDIA_API_KEY must be set}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_CHAT_MODEL: ${NVIDIA_CHAT_MODEL:-deepseek-ai/deepseek-v4.1-flash}
      JWT_PRIVATE_KEY_LOCATION: /deployments/config/privateKey.pem
      JWT_PUBLIC_KEY_LOCATION: /deployments/config/publicKey.pem
    volumes:
      - ${JWT_KEYS_DIR:?JWT_KEYS_DIR must point to a directory containing the JWT keys}:/deployments/config:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/ai-ecommerce-assistant
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_mvp_data:
