quarkus.datasource.db-kind=${DB_KIND:postgresql}

quarkus.datasource.username=${POSTGRES_USER:ecommerce}
quarkus.datasource.password=${POSTGRES_PASSWORD:ecommerce}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
quarkus.flyway.migrate-at-start=true

quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.2
